<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Only24</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
header{display:flex;justify-content:space-between;align-items:center;padding:15px}
.logo{font-size:28px;font-weight:900;cursor:pointer}
.logo span{color:#f5c518}
.search-box{display:flex;gap:5px;background:#1c1c1c;padding:5px 10px;border-radius:20px}
.search-box input{background:none;border:none;color:#fff;outline:none;width:100px}
.search-box button{background:#22c55e;border:none;padding:5px 12px;border-radius:15px;font-weight:700}
.bell{font-size:22px;background:none;border:none}
nav{display:flex;gap:20px;padding:0 15px;font-weight:700;color:#aaa;overflow-x:auto}
nav b{color:#fff;border-bottom:2px solid #22c55e}
h2{padding:20px 15px 10px;font-size:20px}
.filtros{display:flex;gap:8px;padding:0 15px;overflow-x:auto}
.filtros button{background:#222;border:none;color:#fff;padding:8px 14px;border-radius:20px;white-space:nowrap}
.filtros button.ativo{background:#22c55e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden;position:relative}
.card img{width:100%;height:210px;object-fit:cover}
.card p{padding:8px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{padding:0 8px 32px;display:block;color:#f5c518;white-space:nowrap;overflow:hidden;font-size:12px}
.fav{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);border:none;font-size:18px;border-radius:50%;width:30px;height:30px}
.del{position:absolute;top:5px;left:5px;background:red;color:#fff;border:none;border-radius:50%;width:26px;height:26px}
.dl{position:absolute;bottom:8px;right:5px;background:#22c55e;border:none;border-radius:50%;width:30px;height:30px}
footer{text-align:center;color:#888;padding:30px 10px;font-size:13px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:12px;border-top:1px solid #222;z-index:100}
.bottom button{background:none;border:none;color:#fff;font-size:14px}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;z-index:1000}
#menu.aberto{display:flex}
.menu-box{background:#1a1a1a;width:100%;padding:20px;border-radius:20px 20px 0 0}
.menu-box a{display:block;padding:14px 0;color:#fff;text-decoration:none;border-bottom:1px solid #333}
.menu-box button{width:100%;margin-top:15px;padding:12px;background:#22c55e;border:none;border-radius:10px;font-weight:800}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff}
.btn{background:#e50914;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold}
.btn2{background:#22c55e;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold;margin-top:8px}
video{width:100%;border-radius:10px;background:#000}
iframe{width:100%;height:300px;border:none;border-radius:10px}
.ep{display:flex;gap:8px;align-items:center;background:#1c1c1c;padding:10px;border-radius:10px;margin:6px 0}
.ep input{width:20px;height:20px}
.ep button{width:auto;padding:6px 12px;background:#22c55e;border:none;color:#fff;border-radius:8px}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#22c55e;padding:12px 18px;border-radius:20px;z-index:3000;font-weight:bold;display:none}
.notif{position:fixed;top:60px;right:10px;background:#1a1a1a;width:300px;max-width:90vw;border-radius:12px;padding:12px;z-index:2000;display:none}
</style>
</head>
