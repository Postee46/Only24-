<script>

var SUP_KEY="sb_publishable_-jxOZASMNQj1HDP1tq89Rw_rRTrbpyy";
var filmes=[
{t:"Velozes e Furiosos 10",c:"acao",tipo:"filme",n:"8.2",ano:2023,img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdghSi5.jpg",desc:"Corrida e ação.",video:"",eps:[]},

{t:"Super Mario Bros",c:"animacao",tipo:"filme",n:"7.8",ano:2023,img:"https://image.tmdb.org/t/p/w500/qNBAXBIQlnOThrVvA6mA2B5ggV6.jpg",desc:"Mario no cinema.",video:"",eps:[]},
{t:"The Batman",c:"crime",tipo:"filme",n:"7.9",ano:2022,img:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",desc:"Batman em Gotham.",video:"https://www.youtube.com/embed/mqqft2x_Aa4",eps:[]}

{t:"The Last of Us",c:"drama",tipo:"serie",n:"8.8",ano:2023,img:"https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg",desc:"Mundo pós-apocalíptico.",video:"",eps:[{nome:"Ep 1",url:""},{nome:"Ep 2",url:""}]},
{t:"Wednesday",c:"comedia",tipo:"serie",n:"8.4",ano:2022,img:"https://image.tmdb.org/t/p/w500/7Bx65Itkp8tXvDajs01rxIVZ9dw.jpg",desc:"Wednesday na Nevermore.",video:"https://www.youtube.com/embed/Q73UhUTs6y0",eps:[]}
];
var animes=[
{t:"Naruto",c:"acao",tipo:"anime",n:"8.9",ano:2002,img:"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",desc:"Naruto Uzumaki.",video:"",eps:[{nome:"Ep 1",url:""}]},
{t:"One Piece Anime",c:"acao",tipo:"anime",n:"9.0",ano:1999,img:"https://image.tmdb.org/t/p/w500/tXFvfEdRDWz5Wm7pb7IkGPq6Rt4.jpg",desc:"Anime One Piece.",video:"",eps:[]},
{t:"Dragon Ball Super",c:"acao",tipo:"anime",n:"8.5",ano:2015,img:"https://cdn.europosters.eu/image/1300/85466.jpg",desc:"Goku.",video:"",eps:[]}
];
var PF=JSON.parse(JSON.stringify(filmes));
var PS=JSON.parse(JSON.stringify(series));
var PA=JSON.parse(JSON.stringify(animes));
var fav=[];
try{fav=JSON.parse(localStorage.getItem('fav')||'[]')}catch(e){}
var isAdmin=false;
try{isAdmin=localStorage.getItem('only24_admin')==='1'}catch(e){}
var filtroAtual='todos';
var clicksLogo=0; var lastClick=0;
var notificacoes=[];
try{notificacoes=JSON.parse(localStorage.getItem('only24_notif')||'[]')}catch(e){}
var codigos=[];
try{codigos=JSON.parse(localStorage.getItem('only24_codes')||'[]')}catch(e){}
var atualEl='filmes'; var atualIdx=0;
function toast(m){
var t=document.getElementById('toast');
t.innerText=m; t.style.display='block';
setTimeout(function(){t.style.display='none'},3500);
}
function getLista(el){
return el==='filmes'?filmes:el==='series'?series:animes;
}
function criar(lista,el){
var box=document.getElementById(el);
if(!box) return;
var html='';
for(var i=0;i<lista.length;i++){
var f=lista[i];
var fb=fav.indexOf(f.t)>=0?'❤️':'🤍';
var del=isAdmin?'<button class="del" onclick="event.stopPropagation();apagar(\''+el+'\','+i+')">✖</button>':'';
var dl=(f.video||(f.eps&&f.eps.length))?'<button class="dl" onclick="event.stopPropagation();baixarUm(\''+el+'\','+i+')">⬇</button>':'';
html+='<div class="card" onclick="abrir(\''+el+'\','+i+')">'+del+'<button class="fav" onclick="event.stopPropagation();favoritar('+i+',\''+el+'\')">'+fb+'</button><img src="'+f.img+'" onerror="this.src=\'https://via.placeholder.com/300x450?text=Only24\'"><p>'+f.t+'</p><small>⭐ '+f.n+' • '+f.ano+'</small>'+dl+'</div>';
}
box.innerHTML=html||'<p style="padding:10px">Nenhum conteúdo.</p>';
}
function renderTudo(){
var ff=[];
for(var i=0;i<filmes.length;i++){
if(filtroAtual==='todos'||filmes[i].c===filtroAtual) ff.push(filmes[i]);
}
criar(ff,'filmes'); criar(series,'series'); criar(animes,'animes');
}
function filtrar(btn,cat){
var bs=document.querySelectorAll('.filtros button');
for(var i=0;i<bs.length;i++) bs[i].classList.remove('ativo');
btn.classList.add('ativo'); filtroAtual=cat; renderTudo();
}
function pesquisar(){
var v=document.getElementById('pesquisa').value.toLowerCase();
if(!v){renderTudo();return;}
criar(filmes.filter(function(f){return f.t.toLowerCase().indexOf(v)>=0}),'filmes');
criar(series.filter(function(f){return f.t.toLowerCase().indexOf(v)>=0}),'series');
criar(animes.filter(function(f){return f.t.toLowerCase().indexOf(v)>=0}),'animes');
}
function setNav(t){
if(t==='todos'){renderTudo();window.scrollTo(0,0);return;}
if(t==='filme') criar(filmes,'filmes');
if(t==='serie') criar(series,'series');
if(t==='anime') criar(animes,'animes');
}
function mostrarFav(){
var all=filmes.concat(series,animes).filter(function(f){return fav.indexOf(f.t)>=0});
criar(all.filter(function(f){return f.tipo==='filme'}),'filmes');
criar(all.filter(function(f){return f.tipo==='serie'}),'series');
criar(all.filter(function(f){return f.tipo==='anime'}),'animes');
}
function favoritar(i,el){
var t=getLista(el)[i].t;
var ix=fav.indexOf(t);
if(ix>=0) fav.splice(ix,1); else fav.push(t);
try{localStorage.setItem('fav',JSON.stringify(fav))}catch(e){}
renderTudo();
}
function apagar(el,i){
if(!confirm('Apagar?')) return;
var lista=getLista(el); var f=lista[i];
lista.splice(i,1); renderTudo();
if(f.doSup){
fetch(SUP_URL+'/rest/v1/filmes?id=eq.'+f.id,{method:'DELETE',headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY}});
}
}
function baixarUm(el,i){
var f=getLista(el)[i];
if(f.eps&&f.eps.length){ baixarTodos(el,i); return; }
if(f.video){ window.open(f.video,'_blank'); toast('⬇ A baixar '+f.t); }
else toast('Sem vídeo para baixar');
}
function baixarEp(idx){
var f=getLista(atualEl)[atualIdx];
var e=f.eps[idx];
if(e&&e.url) window.open(e.url,'_blank');
}
function verEp(idx){ baixarEp(idx); }
function baixarSelecionados(){
var f=getLista(atualEl)[atualIdx];
var checks=document.querySelectorAll('.chkEp:checked');
var urls=[];
for(var i=0;i<checks.length;i++){
var u=checks[i].getAttribute('data-url');
if(u) urls.push(u);
}
if(!urls.length){toast('Marca pelo menos 1 episódio');return;}
for(var j=0;j<urls.length;j++){
(function(u,k){setTimeout(function(){window.open(u,'_blank')},k*800)})(urls[j],j);
}
toast('⬇ A baixar '+urls.length+' episódios!');
}
function baixarTodos(el,i){
var f=getLista(el)[i];
var urls=[];
for(var k=0;k<f.eps.length;k++){ if(f.eps[k].url) urls.push(f.eps[k].url); }
if(!urls.length){toast('Sem episódios com vídeo');return;}
for(var j=0;j<urls.length;j++){
(function(u,k){setTimeout(function(){window.open(u,'_blank')},k*800)})(urls[j],j);
}
toast('⬇ A baixar todos!');
}
function abrir(el,i){
atualEl=el; atualIdx=i;
var f=getLista(el)[i];
var player='';
if(f.video&&f.video.indexOf('youtube')>=0) player='<iframe src="'+f.video+'" allowfullscreen></iframe>';
else if(f.video) player='<video controls src="'+f.video+'"></video>';
else player='<p>Sem vídeo</p>';
var epsHtml='';
if(f.tipo!=='filme'&&f.eps&&f.eps.length){
epsHtml='<h3 style="margin:15px 0 5px">Episódios - Marca para baixar</h3>';
for(var k=0;k<f.eps.length;k++){
var e=f.eps[k];
epsHtml+='<div class="ep"><input type="checkbox" class="chkEp" data-url="'+(e.url||'')+'"><span style="flex:1">'+e.nome+'</span>'+(e.url?'<button onclick="verEp('+k+')">▶ Ver</button><button onclick="baixarEp('+k+')">⬇ Baixar</button>':'<small>Sem ficheiro</small>')+'</div>';
}
epsHtml+='<button class="btn2" onclick="baixarSelecionados()">⬇ BAIXAR SELECIONADOS DE UMA SÓ VEZ</button><button class="btn2" style="background:#333" onclick="baixarTodos(\''+el+'\','+i+')">⬇ BAIXAR TODOS</button>';
}
var d=document.createElement('div');
d.id='modal';
d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:2000;padding:20px;overflow:auto';
d.innerHTML='<button onclick="document.getElementById(\'modal\').remove()" style="background:red;color:white;border:none;padding:10px 20px;border-radius:20px">✖ Fechar</button><h2 style="margin:15px 0 5px;padding:0">'+f.t+'</h2><p>⭐ '+f.n+' • '+f.ano+' • '+f.c+' • '+f.tipo+'</p><p style="margin:10px 0">'+(f.desc||'')+'</p>'+player+(f.tipo==='filme'&&f.video?'<button class="btn2" onclick="baixarUm(\''+el+'\','+i+')">⬇ BAIXAR FILME</button>':'')+epsHtml;
document.body.appendChild(d);
}
function abrirMenu(){ document.getElementById('menu').classList.add('aberto'); }
function fecharMenu(){ document.getElementById('menu').classList.remove('aberto'); }
function abrirNotif(){
var box=document.getElementById('notifBox');
if(box.style.display==='block'){box.style.display='none';return;}
box.style.display='block';
var html='<b>🔔 Notificações</b><button style="float:right;background:none;border:none;color:#fff" onclick="document.getElementById(\'notifBox\').style.display=\'none\'">✖</button>';
if(notificacoes.length){
for(var i=0;i<Math.min(10,notificacoes.length);i++){
html+='<div>🆕 <b>'+notificacoes[i].t+'</b><br><small>'+notificacoes[i].tipo+'</small></div>';
}
} else html+='<div>Sem notificações novas. Quando o Admin postar, aparece aqui!</div>';
box.innerHTML=html;
}
function clickLogo(){
var now=Date.now();
if(now-lastClick>1000) clicksLogo=0;
clicksLogo++; lastClick=now;
if(clicksLogo>=5){clicksLogo=0; entrarAdmin();}
}
function entrarAdmin(){
if(isAdmin){abrirAdmin();return;}
var s=prompt('🔐 Área restrita.\nAdmin: mete a senha\nConvidado: mete o código de convite');
if(s==='1234'||codigos.indexOf(s)>=0){
isAdmin=true;
try{localStorage.setItem('only24_admin','1')}catch(e){}
toast('Bem-vindo Admin!'); abrirAdmin();
} else alert('Senha / código errado!');
}
function sairAdmin(){
var m=document.getElementById('modal'); if(m) m.remove();
isAdmin=false;
try{localStorage.removeItem('only24_admin')}catch(e){}
renderTudo();
}
function abrirAdmin(){
if(!isAdmin){entrarAdmin();return;}
var m=document.getElementById('modal'); if(m) m.remove();
var d=document.createElement('div');
d.id='modal';
d.style.cssText='position:fixed;inset:0;background:#111;z-index:2000;padding:20px;overflow:auto';
var codHtml='';
if(codigos.length){
for(var i=0;i<codigos.length;i++){
codHtml+='<div style="background:#222;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between"><b>'+codigos[i]+'</b><button style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:8px;width:auto" onclick="removerCodigo('+i+')">Remover</button></div>';
}
} else codHtml='<p style="color:#888">Nenhum código ainda.</p>';
d.innerHTML='<button onclick="sairAdmin()" style="background:red;color:white;border:none;padding:10px 20px;border-radius:20px">✖ Sair do Admin</button><h2 style="margin:15px 0">🔐 Painel Admin</h2><input id="nTitulo" placeholder="Título"><select id="nTipo"><option value="filme">🎬 Filme</option><option value="serie">📺 Série</option><option value="anime">✨ Anime</option></select><select id="nCat"><option value="acao">Ação</option><option value="animacao">Animação</option><option value="crime">Crime</option><option value="comedia">Comédia</option><option value="drama">Drama</option><option value="terror">Terror</option></select><input id="nAno" placeholder="Ano ex: 2024" type="number"><input id="nNota" placeholder="Nota ex: 8.5"><p style="font-size:13px;color:#aaa">📸 Foto do poster - DO TEU TELEMÓVEL / PC:</p><input type="file" id="nFoto" accept="image/*"><input id="nImg" placeholder="OU cola link da imagem"><p style="font-size:13px;color:#aaa">🎬 Vídeo do FILME - DO TEU TELEMÓVEL / PC:</p><input type="file" id="nVideoFile" accept="video/*"><input id="nVideo" placeholder="OU link YouTube"><p style="font-size:13px;color:#aaa">📺 EPISÓDIOS - Seleciona VÁRIOS vídeos de uma vez:</p><input type="file" id="nEps" accept="video/*" multiple><textarea id="nDesc" placeholder="Descrição"></textarea><button class="btn" id="btnPub" onclick="salvarNovo()">✅ PUBLICAR AGORA + NOTIFICAR TODOS</button><p id="statusPub" style="text-align:center;margin-top:10px"></p><hr style="margin:20px 0;border-color:#333"><h3>👥 Quem pode entrar? Só tu decides</h3><button class="btn2" onclick="criarCodigo()">+ Criar Novo Código</button><div style="margin-top:10px">'+codHtml+'</div>';
document.body.appendChild(d);
renderTudo();
}
function criarCodigo(){
var c='ONLY-'+Math.random().toString(36).substring(2,7).toUpperCase();
codigos.push(c);
try{localStorage.setItem('only24_codes',JSON.stringify(codigos))}catch(e){}
alert('Código criado: '+c);
abrirAdmin();
}
function removerCodigo(ix){
codigos.splice(ix,1);
try{localStorage.setItem('only24_codes',JSON.stringify(codigos))}catch(e){}
abrirAdmin();
}
function salvarNovo(){
var btn=document.getElementById('btnPub');
btn.innerText='A ENVIAR...';
var t=document.getElementById('nTitulo').value;
if(!t){alert('Escreve o título!');btn.innerText='✅ PUBLICAR AGORA + NOTIFICAR TODOS';return;}
var imgUrl=document.getElementById('nImg').value;
var vidUrl=document.getElementById('nVideo').value;
var foto=document.getElementById('nFoto').files[0];
var vf=document.getElementById('nVideoFile').files[0];
var epsFiles=document.getElementById('nEps').files;
var tipo=document.getElementById('nTipo').value;
var cat=document.getElementById('nCat').value;
var ano=document.getElementById('nAno').value||'2024';
var nota=document.getElementById('nNota').value||'7.0';
var desc=document.getElementById('nDesc').value||'';
(async function(){
try{
if(foto){
var n1=Date.now()+'_'+foto.name;
var fd1=new FormData(); fd1.append('file',foto);
var r1=await fetch(SUP_URL+'/storage/v1/object/posters/'+n1,{method:'POST',headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY},body:fd1});
if(!r1.ok) throw new Error('Falha no upload da foto');
imgUrl=SUP_URL+'/storage/v1/object/public/posters/'+n1;
}
if(vf){
var n2=Date.now()+'_'+vf.name;
var fd2=new FormData(); fd2.append('file',vf);
var r2=await fetch(SUP_URL+'/storage/v1/object/videos/'+n2,{method:'POST',headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY},body:fd2});
if(!r2.ok) throw new Error('Falha no upload do vídeo');
vidUrl=SUP_URL+'/storage/v1/object/public/videos/'+n2;
}
var eps=[];
for(var i=0;i<epsFiles.length;i++){
var f=epsFiles[i];
var n3=Date.now()+'_ep'+(i+1)+'_'+f.name;
var fd3=new FormData(); fd3.append('file',f);
var r3=await fetch(SUP_URL+'/storage/v1/object/videos/'+n3,{method:'POST',headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY},body:fd3});
if(r3.ok) eps.push({nome:'Ep '+(i+1)+' - '+f.name,url:SUP_URL+'/storage/v1/object/public/videos/'+n3});
}
if(!imgUrl) imgUrl='https://via.placeholder.com/300x450?text='+encodeURIComponent(t);
var videoFinal=vidUrl;
if(eps.length) videoFinal=JSON.stringify(eps);
var res=await fetch(SUP_URL+'/rest/v1/filmes',{method:'POST',headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({titulo:t,tipo:tipo,categoria:cat,ano:ano,nota:nota,imagem:imgUrl,descricao:desc,video:videoFinal})});
if(!res.ok) throw new Error('Falha ao publicar. Verifica a tabela filmes no Supabase.');
notificacoes.unshift({t:t,tipo:tipo});
try{localStorage.setItem('only24_notif',JSON.stringify(notificacoes))}catch(e){}
alert('Publicado! ✅');
sairAdmin(); carregarSup();
}catch(e){
var s=document.getElementById('statusPub');
if(s) s.innerText='❌ '+e.message;
btn.innerText='✅ PUBLICAR AGORA + NOTIFICAR TODOS';
}
})();
}
function carregarSup(){
try{
fetch(SUP_URL+'/rest/v1/filmes?select=*&order=created_at.desc',{headers:{apikey:SUP_KEY,Authorization:'Bearer '+SUP_KEY}}).then(function(r){return r.json()}).then(function(data){
if(!data||!data.length||data.message) return;
var sup=[];
for(var i=0;i<data.length;i++){
var f=data[i]; var eps=[]; var vid=f.video||'';
try{ var p=JSON.parse(vid); if(Array.isArray(p)){eps=p;vid='';} }catch(e){}
sup.push({t:f.titulo,c:(f.categoria||'acao').toLowerCase(),tipo:(f.tipo||'filme').toLowerCase(),n:f.nota,ano:f.ano,img:f.imagem,desc:f.descricao,video:vid,eps:eps,id:f.id,doSup:true});
}
filmes=sup.filter(function(s){return s.tipo==='filme'}).concat(PF);
series=sup.filter(function(s){return s.tipo==='serie'}).concat(PS);
animes=sup.filter(function(s){return s.tipo==='anime'}).concat(PA);
renderTudo();
}).catch(function(){});
}catch(e){}
}
renderTudo();
setTimeout(carregarSup,500);
if(window.location.search.indexOf('admin')>=0){ setTimeout(entrarAdmin,800); }
</script>
