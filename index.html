<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Only24</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0f;color:#fff;font-family:Arial}header{background:#111;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header b{font-size:24px;color:#e50914}header b span{color:#fff}input,select,textarea{background:#222;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;width:100%;margin:5px 0}button{background:#e50914;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}button:hover{background:#ff1a2a}.cats{display:flex;gap:8px;overflow:auto;padding:12px}.cats button{width:auto;white-space:nowrap;background:#222}.cats button.ativo{background:#e50914}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px}.card{background:#16161f;border-radius:12px;overflow:hidden;cursor:pointer}.card img{width:100%;height:220px;object-fit:cover}.card div{padding:10px}.card small{color:#aaa}.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:15px}.modal.open{display:flex}.box{background:#16161f;width:100%;max-width:650px;border-radius:14px;overflow:hidden;max-height:90vh;overflow:auto}.box img{width:100%;height:280px;object-fit:cover}.box div{padding:15px}video{width:100%;border-radius:10px;background:#000}.admin{max-width:500px;margin:20px auto;padding:15px;background:#16161f;border-radius:14px}.hidden{display:none}</style></head><body>
<header><b>Only<span>24</span></b><div style="display:flex;gap:8px"><button style="width:auto;padding:8px 14px" onclick="document.getElementById('admin').classList.toggle('hidden')">Admin</button></div></header>
<input id="busca" placeholder="🔍 Pesquisar filme..." style="margin:12px;width:calc(100% - 24px)" oninput="render()">
<div class="cats"><button class="ativo" onclick="filtrar('Tudo',this)">Tudo</button><button onclick="filtrar('Filme',this)">Filmes</button><button onclick="filtrar('Série',this)">Séries</button><button onclick="filtrar('Anime',this)">Animes</button><button onclick="filtrar('Ação',this)">Ação</button><button onclick="filtrar('Comédia',this)">Comédia</button><button onclick="filtrar('Drama',this)">Drama</button><button onclick="filtrar('Terror',this)">Terror</button></div>
<div id="admin" class="admin hidden"><h3>Publicar Novo Filme</h3><input id="titulo" placeholder="Título"><select id="tipo"><option>Filme</option><option>Série</option><option>Anime</option></select><select id="categoria"><option>Ação</option><option>Comédia</option><option>Drama</option><option>Terror</option><option>Romance</option></select><input id="ano" placeholder="Ano ex: 2024"><input id="nota" placeholder="Nota ex: 8.5"><label style="font-size:13px;color:#aaa">Foto do poster:</label><input type="file" id="foto" accept="image/*"><label style="font-size:13px;color:#aaa">Vídeo:</label><input type="file" id="videoFile" accept="video/*"><textarea id="descricao" placeholder="Descrição"></textarea><button onclick="publicar()" id="btnPub">PUBLICAR NO ONLY24</button><p id="status" style="text-align:center;margin-top:10px;font-size:13px"></p></div>
<div id="lista" class="grid"></div>
<div id="modal" class="modal" onclick="if(event.target==this)this.classList.remove('open')"><div class="box" id="modalBox"></div></div>
<script>
const SUPABASE_URL = "https://hvhznhdtswrmyozlpyq.supabase.co";
const SUPABASE_KEY = "sb_publishable_-jxOZASMNQj1HDP1tq89Rw_rRTrbpyy";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let filmes = []; let filtro = 'Tudo';
async function carregar(){
  const {data} = await supabase.from('filmes').select('*').order('created_at',{ascending:false});
  filmes = data || [];
  render();
}
function filtrar(f, btn){ filtro=f; document.querySelectorAll('.cats button').forEach(b=>b.classList.remove('ativo')); btn.classList.add('ativo'); render(); }
function render(){
  const busca = document.getElementById('busca').value.toLowerCase();
  let lista = filmes.filter(f => (filtro=='Tudo' || f.tipo==filtro || f.categoria==filtro) && f.titulo.toLowerCase().includes(busca));
  document.getElementById('lista').innerHTML = lista.length ? lista.map(f=>`<div class="card" onclick="abrir(${f.id})"><img src="${f.imagem}"><div><b>${f.titulo}</b><br><small>${f.tipo} • ${f.ano} • ⭐ ${f.nota}</small></div></div>`).join('') : '<p style="padding:20px;text-align:center">Ainda não tem filmes. Publica no Admin.</p>';
}
function abrir(id){
  const f = filmes.find(x=>x.id==id);
  document.getElementById('modalBox').innerHTML = `<img src="${f.imagem}"><div><h2>${f.titulo}</h2><p style="color:#aaa;margin:8px 0">${f.tipo} • ${f.categoria} • ${f.ano} • ⭐ ${f.nota}</p><p>${f.descricao||''}</p>${f.video?`<video controls src="${f.video}"></video>`:''}<br><button onclick="document.getElementById('modal').classList.remove('open')">Fechar</button></div>`;
  document.getElementById('modal').classList.add('open');
}
async function publicar(){
  const btn=document.getElementById('btnPub'); btn.innerText='A ENVIAR...'; document.getElementById('status').innerText='A enviar foto e vídeo, espera...';
  try{
    let imagemUrl='', videoUrl='';
    const foto=document.getElementById('foto').files[0];
    const video=document.getElementById('videoFile').files[0];
    if(foto){ const nome=Date.now()+'_'+foto.name; const {error}=await supabase.storage.from('posters').upload(nome, foto); if(error) throw error; imagemUrl=supabase.storage.from('posters').getPublicUrl(nome).data.publicUrl; }
    if(video){ const nome=Date.now()+'_'+video.name; const {error}=await supabase.storage.from('videos').upload(nome, video); if(error) throw error; videoUrl=supabase.storage.from('videos').getPublicUrl(nome).data.publicUrl; }
    const {error}=await supabase.from('filmes').insert([{titulo:document.getElementById('titulo').value, tipo:document.getElementById('tipo').value, categoria:document.getElementById('categoria').value, ano:document.getElementById('ano').value, nota:document.getElementById('nota').value, imagem:imagemUrl, descricao:document.getElementById('descricao').value, video:videoUrl}]);
    if(error) throw error;
    document.getElementById('status').innerText='✅ Publicado! Toda a gente já vê!'; carregar();
  }catch(e){ document.getElementById('status').innerText='❌ Erro: '+e.message; }
  btn.innerText='PUBLICAR NO ONLY24';
}
carregar();
</script></body></html>
