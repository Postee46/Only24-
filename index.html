<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ONLY24²⁴ - Filmes, Séries e Animes</title>

  <meta name="description" content="ONLY24²⁴ - Descobre filmes, séries, animes e entretenimento num só lugar.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ONLY24²⁴ - Filmes, Séries, Animes e Entretenimento">
  <meta property="og:description" content="Assiste filmes, séries, animes e clipes num só lugar no ONLY24²⁴.">
  <meta property="og:url" content="https://postee46.github.io/Only24-/">
  <meta property="og:image" content="https://postee46.github.io/Only24-/og-logo.jpg">

  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase e HLS (.m3u8) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash">
    <div id="splashLogo">ONLY<span>24²⁴</span></div>
    <div class="splash-load"></div>
  </div>

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="topbar-inner">

      <button type="button" id="logo" class="logo">
        ONLY<span>24²⁴</span>
      </button>

      <div class="search-box">
        <input id="searchInput" type="search" placeholder="Pesquisar filmes, séries, animes..." autocomplete="off">
        <button type="button" id="searchBtn" aria-label="Pesquisar">🔍</button>
      </div>

      <div class="top-actions">

        <button type="button" id="bellBtn" class="icon-btn" aria-label="Notificações">
          🔔
          <span id="bellDot" class="dot hidden"></span>
        </button>

        <button type="button" id="loginBtn" class="btn-secondary top-login">Entrar</button>

        <button type="button" id="avatarBtn" class="avatar-btn hidden" aria-label="Perfil">
          <img id="avatarImg" class="hidden" alt="Foto do perfil">
          <span id="avatarLetter">👤</span>
        </button>

        <div id="userMenu" class="user-menu hidden">
          <button type="button" id="profileBtn">Meu Perfil</button>
          <button type="button" id="adminBtn" class="hidden">Painel Admin</button>
          <button type="button" id="logoutBtn">Sair</button>
        </div>

        <button type="button" id="installBtn" class="install-btn hidden">Instalar App</button>

      </div>
    </div>

    <!-- NAVIGATION -->
    <nav id="mainNav">
      <button type="button" class="nav-btn active" data-nav="home">Início</button>
      <button type="button" class="nav-btn" data-nav="filmes">Filmes</button>
      <button type="button" class="nav-btn" data-nav="series">Séries</button>
      <button type="button" class="nav-btn" data-nav="anime">Animes</button>
      <button type="button" class="nav-btn" data-nav="musica">Entretenimento</button>
      <button type="button" class="nav-btn" data-nav="mylist">Minha Lista</button>
    </nav>
  </header>

  <!-- HERO -->
  <section id="hero">
    <img id="heroBg" class="hidden" alt="Destaque">
    <div class="hero-overlay"></div>

    <button type="button" id="heroPrev" class="hero-arrow prev hidden" aria-label="Destaque anterior">‹</button>
    <button type="button" id="heroNext" class="hero-arrow next hidden" aria-label="Próximo destaque">›</button>

    <div class="hero-content">
      <h1 id="heroTitle">Bem-vindo ao ONLY24²⁴</h1>
      <p id="heroMeta"></p>
      <p id="heroDesc"></p>

      <div class="hero-btns">
        <button type="button" id="heroPlay" class="btn-primary">▶ Assistir</button>
        <button type="button" id="heroInfo" class="btn-secondary">ℹ️ Detalhes</button>
      </div>
    </div>

    <div id="heroDots" class="hero-dots hidden"></div>
  </section>
