
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>ONLY24²⁴ - Filmes, Séries e Animes</title>

  <meta name="description" content="ONLY24²⁴ - Descobre filmes, séries e animes num só lugar.">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash">
    <div id="splashLogo">ONLY<span>24²⁴</span></div>
    <div class="splash-load"></div>
  </div>

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="topbar-inner">

      <button id="logo" class="logo">
        ONLY<span>24²⁴</span>
      </button>

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="Pesquisar filmes, séries, animes..."
          autocomplete="off"
        >
        <button id="searchBtn" aria-label="Pesquisar">🔍</button>
      </div>

      <div class="top-actions">

        <button id="bellBtn" class="icon-btn" aria-label="Notificações">
          🔔
          <span id="bellDot" class="dot hidden"></span>
        </button>

        <button id="avatarBtn" class="avatar-btn" aria-label="Perfil">
          <img id="avatarImg" src="" alt="Foto do perfil">
          <span id="avatarLetter">U</span>
        </button>

        <div id="userMenu" class="user-menu hidden">
          <button id="adminBtn" class="hidden">Painel Admin</button>
          <button id="logoutBtn">Sair</button>
        </div>

        <button id="installBtn" class="install-btn hidden">
          Instalar App
        </button>

      </div>
    </div>

    <!-- NAVIGATION -->
    <nav id="mainNav">
      <button class="nav-btn active" data-nav="home">Início</button>
      <button class="nav-btn" data-nav="filmes">Filmes</button>
      <button class="nav-btn" data-nav="series">Séries</button>
      <button class="nav-btn" data-nav="anime">Animes</button>
      <button class="nav-btn" data-nav="mylist">Minha Lista</button>
    </nav>
  </header>

  <!-- HERO -->
  <section id="hero">

    <img id="heroBg" src="" alt="Destaque">

    <div class="hero-overlay"></div>

    <div class="hero-content">

      <h1 id="heroTitle">Bem-vindo ao ONLY24²⁴</h1>

      <p id="heroMeta"></p>

      <p id="heroDesc"></p>

      <div class="hero-btns">
        <button id="heroPlay" class="btn-primary">
          ▶ Assistir
        </button>

        <button id="heroInfo" class="btn-secondary">
          ℹ️ Detalhes
        </button>
      </div>

    </div>
  </section>

  <!-- MAIN -->
  <main id="main">

    <!-- SEARCH RESULTS -->
    <section id="searchResults" class="hidden">
      <h2>Resultados da pesquisa</h2>
      <div id="gridHome" class="grid"></div>
    </section>

    <!-- HOME SECTIONS -->
    <section id="homeSections">

      <h2>Continuar a assistir</h2>
      <div id="continueRow" class="row"></div>

      <h2>Em destaque</h2>
      <div id="catGrid" class="grid"></div>

      <h2>Séries</h2>
      <div id="seriesGrid" class="grid"></div>

      <h2>Animes</h2>
      <div id="animeGrid" class="grid"></div>

      <h2>Histórico</h2>
      <div id="historyRow" class="row"></div>

      <h2>Minha Lista</h2>
      <div id="myList" class="grid"></div>

    </section>
  </main>

  <!-- ADMIN BUTTONS -->
  <button id="fabAdmin" class="fab hidden" aria-label="Admin">
    ⚙️
  </button>

  <button id="fabAdd" class="fab fab-add hidden" aria-label="Adicionar conteúdo">
    ＋
  </button>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal hidden">
    <div class="modal-box">

      <button id="closeAuth" class="close">X</button>

      <h2 id="authTitle">Entrar</h2>

      <input
        id="authName"
        type="text"
        placeholder="Nome"
        class="hidden"
      >

      <input
        id="authEmail"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="authPass"
        type="password"
        placeholder="Senha"
        autocomplete="current-password"
      >

      <button id="authSubmit" class="btn-primary full">
        Entrar
      </button>

      <p>
        <button id="authSwitch" class="link">
          Criar conta nova
        </button>
      </p>

    </div>
  </div>

  <!-- TITLE MODAL -->
  <div id="titleModal" class="modal hidden">
    <div class="modal-box large">

      <button id="tmClose" class="close">X</button>

      <img id="tmBackdrop" src="" alt="Imagem de destaque">

      <div class="tm-body">

        <img id="tmPoster" src="" alt="Cartaz">

        <div>
          <h2 id="tmTitle"></h2>

          <p id="tmMeta"></p>

          <p id="tmDesc"></p>

          <p id="tmCast"></p>

          <div class="tm-btns">

            <button id="tmPlay" class="btn-primary">
              ▶ Assistir
            </button>

            <button id="tmFav" class="btn-secondary">
              ＋ Minha Lista
            </button>

            <button id="tmTrailer" class="btn-secondary">
              ▶ Trailer
            </button>

          </div>

        </div>
      </div>

      <div id="tmEpisodes"></div>

    </div>
  </div>

  <!-- PLAYER MODAL -->
  <div id="playerModal" class="modal hidden">
    <div class="modal-box player-box">

      <button id="closePlayer" class="close">X</button>

      <h3 id="playerTitle"></h3>

      <video
        id="player"
        controls
        playsinline
        preload="metadata"
        controlsList="nodownload"
      ></video>

      <div class="player-tools">

        <button id="downloadBtn" class="btn-secondary">
          Download
        </button>

        <select id="qualityList" aria-label="Qualidade de vídeo">
          <option value="">Qualidade</option>
        </select>

        <select id="subtitleList" aria-label="Legendas">
          <option value="">Legendas</option>
        </select>

      </div>

      <div id="dlList"></div>

    </div>
  </div>

  <!-- NOTIFICATIONS -->
  <div id="notifModal" class="modal hidden">
    <div class="modal-box">

      <button id="notifClose" class="close">X</button>

      <h2>Notificações</h2>

      <div id="notifList"></div>

      <button id="notifClear" class="btn-secondary full">
        Limpar
      </button>

    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="modal hidden">
    <div class="modal-box large admin-box">

      <button id="adminClose" class="close">X</button>

      <h2>Painel Admin</h2>

      <div class="admin-grid">

        <input id="fTitle" placeholder="Título *">

        <select id="fType">
          <option value="filme">Filme</option>
          <option value="serie">Série</option>
          <option value="anime">Anime</option>
        </select>

        <select id="fGenre">
          <option value="acao">Ação</option>
          <option value="drama">Drama</option>
          <option value="terror">Terror</option>
          <option value="comedia">Comédia</option>
          <option value="romance">Romance</option>
          <option value="ficcao">Ficção</option>
          <option value="animacao">Animação</option>
          <option value="documentario">Documentário</option>
        </select>

        <input id="fYear" type="number" placeholder="Ano">

        <input id="fRating" type="number" step="0.1" placeholder="Nota: 8.5">

        <textarea id="fSynopsis" placeholder="Sinopse"></textarea>

        <input id="fCast" placeholder="Elenco">

        <label>
          <input id="fFeatured" type="checkbox">
          Em destaque
        </label>

        <input id="fTrailer" placeholder="Link Trailer YouTube">

        <input id="fSubtitle" placeholder="Link Legenda .vtt">

        <input id="fDownload" placeholder="Link Download autorizado">

        <input
          id="fQualities"
          placeholder='Qualidades JSON: [{"label":"720p","url":"https://..."}]'
        >

        <input id="fPoster" placeholder="Link Poster">

        <input id="fBackdrop" placeholder="Link Backdrop">

        <label>
          Poster ficheiro
          <input id="fPosterFile" type="file" accept="image/*">
        </label>

        <label>
          Vídeo ficheiro
          <input id="fVideoFile" type="file" accept="video/*">
        </label>

        <label>
          Legenda ficheiro
          <input id="fSubtitleFile" type="file" accept=".vtt">
        </label>

      </div>

      <h3>Episódios (séries / animes)</h3>

      <div id="episodesWrap"></div>

      <button id="addEp" class="btn-secondary">
        ＋ Adicionar Episódio
      </button>

      <button id="saveAdmin" class="btn-primary full">
        Salvar Título
      </button>

      <h3>Títulos existentes</h3>

      <div id="adminList"></div>

      <h3>Enviar Notificação</h3>

      <input id="notifTitle" placeholder="Título da notificação">

      <input id="notifBody" placeholder="Mensagem">

      <select id="notifTitleId">
        <option value="">Sem título ligado</option>
      </select>

      <button id="sendNotif" class="btn-secondary full">
        Enviar Notificação
      </button>

    </div>
  </div>

  <!-- INSTALL BANNER -->
  <div id="installBanner" class="install-banner hidden">

    <span>Instala o ONLY24²⁴ para melhor experiência</span>

    <button id="installNow" class="btn-primary">
      Instalar
    </button>

    <button id="installLater" class="btn-secondary">
      Depois
    </button>

  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <!-- APPLICATION SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

  <!-- SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('./sw.js')
          .catch(function (error) {
            console.error('Erro ao registar Service Worker:', error);
          });
      });
    }

    window.addEventListener('load', function () {
      const splash = document.getElementById('splash');

      if (splash) {
        setTimeout(function () {
          splash.style.display = 'none';
        }, 2500);
      }
    });
  </script>

</body>
</html>
