<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Only24</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;padding-bottom:80px}
header{display:flex;justify-content:space-between;padding:15px;align-items:center}
.logo{font-size:28px;font-weight:900;cursor:pointer}.logo span{color:#f5c518}
button{cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.card{background:#1a1a1a;border-radius:10px;overflow:hidden}
.card img{width:100%;height:210px;object-fit:cover}
.card p{padding:8px;font-size:13px;font-weight:700}
.card small{padding:0 8px 10px;display:block;color:#f5c518}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;padding:20px;z-index:99}
#menu.on{display:block}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff}
</style></head><body>
<header><div><button onclick="abrirMenu()" style="background:none;border:none;color:#fff;font-size:26px">☰</button> <span class="logo" onclick="clickLogo()">Only<span>24</span></span></div>
<input id="pesq" placeholder="Pesquisar..." oninput="mostrar()" style="width:130px"></header>
<h2 style="padding:10px 15px">FILMES</h2><div class="grid" id="filmes"></div>
<h2 style="padding:10px 15px">SÉRIES</h2><div class="grid" id="series"></div>
<h2 style="padding:10px 15px">ANIMES</h2><div class="grid" id="animes"></div>
<footer style="text-align:center;color:#888;padding:20px">Only24<br>© 2026 Only24</footer>
<div id="menu"><h2>MENU</h2><p onclick="mostrar();fecharMenu()" style="padding:12px 0">🏠 Início</p><p onclick="alert('Favoritos OK')" style="padding:12px 0">❤️ Favoritos</p><button onclick="fecharMenu()" style="padding:12px;background:#22c55e;border:none;border-radius:10px;width:100%">Fechar</button></div>
<script>
var F=[
{t:"Velozes 10",n:"8.2",ano:2023,img:"https://image.tmdb.org/t/p/w500/fiVW06jE7z9YnO4trhaMEdghSi5.jpg",tipo:"filme"},
{t:"John Wick 4",n:"8.5",ano:2023,img:"https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",tipo:"filme"},
{t:"The Batman",n:"7.9",ano:2022,img:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",tipo:"filme"}
];
var S=[
{t:"The Last of Us",n:"8.8",ano:2023,img:"https://image.tmdb.org/t/p/w500/uKvVjHNqB5VmOrdxqAt2F7J78ED.jpg",tipo:"serie"},
{t:"Wednesday",n:"8.4",ano:2022,img:"https://image.tmdb.org/t/p/w500/7Bx65Itkp8tXvDajs01rxIVZ9dw.jpg",tipo:"serie"}
];
var A=[
{t:"Naruto",n:"8.9",ano:2002,img:"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",tipo:"anime"},
{t:"One Piece",n:"9.0",ano:1999,img:"https://image.tmdb.org/t/p/w500/tXFvfEdRDWz5Wm7pb7IkGPq6Rt4.jpg",tipo:"anime"},
{t:"Dragon Ball Super",n:"8.5",ano:2015,img:"https://cdn.europosters.eu/image/1300/85466.jpg",tipo:"anime"}
];
var cliques=0, ultimo=0;
function criar(lista,el){
var b=document.getElementById(el), h="";
for(var i=0;i<lista.length;i++){
var f=lista[i];
h+='<div class="card" onclick="alert(\'Abriu: '+f.t+'\')"><img src="'+f.img+'" onerror="this.src=\'https://via.placeholder.com/300x450?text=Only24\'"><p>'+f.t+'</p><small>⭐ '+f.n+' • '+f.ano+'</small></div>';
}
b.innerHTML=h;
}
function mostrar(){
var v=document.getElementById('pesq').value.toLowerCase();
function fil(arr){ return arr.filter(function(f){ return !v || f.t.toLowerCase().indexOf(v)>=0; }); }
criar(fil(F),'filmes'); criar(fil(S),'series'); criar(fil(A),'animes');
}
function abrirMenu(){ document.getElementById('menu').classList.add('on'); }
function fecharMenu(){ document.getElementById('menu').classList.remove('on'); }
function clickLogo(){
var agora=Date.now();
if(agora-ultimo>1000) cliques=0;
cliques++; ultimo=agora;
if(cliques>=5){ cliques=0; var s=prompt('Senha Admin:'); if(s==='1234'){ alert('✅ Admin OK! O sistema está a funcionar!'); } else { alert('Senha errada'); } }
}
mostrar();
</script></body></html>
