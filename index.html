<!DOCTYPE html>
<html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Only24</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff;padding-bottom:50px}header{display:flex;justify-content:space-between;align-items:center;padding:15px}.logo{font-size:28px;font-weight:900}.logo span{color:#e50914}.menu-btn{font-size:26px;background:none;border:none;color:#fff}.btn-pesq{background:#e50914;color:#fff;border:none;padding:10px 18px;border-radius:25px;font-weight:bold}.search{margin:0 15px;background:#1a1a1a;border-radius:25px;padding:12px 18px}.search input{background:transparent;border:none;outline:none;color:#fff;width:100%;font-size:16px}.filtros{display:flex;gap:8px;padding:15px;overflow-x:auto}.filtros button{background:#222;color:#fff;border:none;padding:9px 16px;border-radius:20px;white-space:nowrap}.filtros button.active{background:#e50914}h2{padding:0 15px 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 15px}.card{background:#111;border-radius:12px;overflow:hidden;position:relative;cursor:pointer}.card img{width:100%;height:220px;object-fit:cover;display:block}.card-info{padding:10px}.card-info h3{font-size:14px}.card-info p{font-size:12px;color:#aaa;margin:5px 0 8px}.card-info button{background:#e50914;color:#fff;border:none;padding:7px;border-radius:15px;width:100%;margin-top:4px}.del{position:absolute;top:5px;right:5px;background:red;color:#fff;border:none;border-radius:50%;width:28px;height:28px;z-index:5}#menu{position:fixed;top:0;left:-260px;width:250px;height:100%;background:#111;z-index:1000;transition:.3s;padding:20px}#menu.aberto{left:0}#menu a{display:block;color:#fff;text-decoration:none;padding:12px 0;border-bottom:1px solid #222}#menu button{background:#e50914;color:#fff;border:none;padding:10px;width:100%;border-radius:10px;margin-top:15px}#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;z-index:999}#overlay.show{display:block}input,select,textarea{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#222;color:#fff}.btn{background:#e50914;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-weight:bold}video{width:100%;border-radius:10px;background:#000}iframe{width:100%;height:300px;border:none;border-radius:10px}</style></head><body>
<div id="overlay" onclick="fecharMenu()"></div>
<div id="menu"><h2>Only<span style="color:#e50914">24</span> ☰</h2><a href="#" onclick="setFiltro('todos');fecharMenu()">🏠 Início</a><a href="#" onclick="setFiltro('filme');fecharMenu()">🎬 Filmes</a><a href="#" onclick="setFiltro('serie');fecharMenu()">📺 Séries</a><a href="#" onclick="setFiltro('favoritos');fecharMenu()">❤️ Favoritos</a><a href="#" onclick="setFiltro('acao');fecharMenu()">🔥 Ação</a><a href="#" onclick="setFiltro('comedia');fecharMenu()">😂 Comédia</a><a href="#" onclick="setFiltro('drama');fecharMenu()">🎭 Drama</a><a href="#" onclick="setFiltro('terror');fecharMenu()">👻 Terror</a><button onclick="abrirAdmin()">🔐 Área Admin</button><button onclick="fecharMenu()" style="background:#333">✖ Fechar</button></div>
<header><button class="menu-btn" onclick="abrirMenu()">☰</button><div class="logo">Only<span>24</span></div><button class="btn-pesq" onclick="document.getElementById('busca').focus()">🔍 Pesquisar</button></header>
<div class="search"><input id="busca" placeholder="Pesquisar filmes, séries..." oninput="mostrar()"></div>
<div id="conteudo"></div>
<script>
const supabase = window.supabase.createClient("https://hvhznhdtswrmyozlpyq.supabase.co","sb_publishable_-jxOZASMNQj1HDP1tq89Rw_rRTrbpyy");
let PADRAO=[
{id:1,t:"Vingadores: Ultimato",tipo:"filme",cat:"Ação",ano:2019,nota:"8.4",img:"https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",desc:"Heróis tentam reverter o estalo.",video:"https://www.youtube.com/embed/TcMBFSGVi1c"},
{id:2,t:"Homem-Aranha: Sem Volta",tipo:"filme",cat:"Ação",ano:2021,nota:"8.2",img:"https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",desc:"Peter pede ajuda ao Doutor Estranho.",video:"https://www.youtube.com/embed/JfVOs4VSpmA"},
{id:3,t:"Batman",tipo:"filme",cat:"Ação",ano:2022,nota:"7.7",img:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",desc:"Batman em Gotham.",video:"https://www.youtube.com/embed/mqqft2x_Aa4"},
{id:6,t:"Stranger Things",tipo:"serie",cat:"Terror",ano:2016,nota:"8.7",img:"https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg",desc:"Mundo Invertido.",video:"https://www.youtube.com/embed/b9EkMc79ZSU"},
{id:10,t:"Wednesday",tipo:"serie",cat:"Comédia",ano:2022,nota:"8.5",img:"https://image.tmdb.org/t/p/w500/9PFonBhy4cQy7Jz20NpMygczOkv.jpg",desc:"Wednesday na Nevermore.",video:"https://www.youtube.com/embed/Q73UhUTs6y0"},
{id:12,t:"Joker",tipo:"filme",cat:"Drama",ano:2019,nota:"8.4",img:"https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg",desc:"Origem do Coringa.",video:"https://www.youtube.com/embed/zAGVQLHvwOY"}];
let FILMES=[...PADRAO]; let fav=JSON.parse(localStorage.getItem('fav')||'[]'); let filtro='todos'; let isAdmin=false;
async function carregar(){ const {data}=await supabase.from('filmes').select('*').order('created_at',{ascending:false}); if(data){ let sup=data.map(f=>({id:f.id,t:f.titulo,tipo:f.tipo.toLowerCase(),cat:f.categoria,ano:f.ano,nota:f.nota,img:f.imagem,desc:f.descricao,video:f.video,doSup:true})); FILMES=[...sup,...PADRAO]; } mostrar(); }
function abrirMenu(){document.getElementById('menu').classList.add('aberto');document.getElementById('overlay').classList.add('show')}
function fecharMenu(){document.getElementById('menu').classList.remove('aberto');document.getElementById('overlay').classList.remove('show')}
function mostrar(){ let busca=document.getElementById('busca').value.toLowerCase(); let lista=FILMES.filter(f=>{ if(filtro==='filme'&&f.tipo!=='filme')return false; if(filtro==='serie'&&f.tipo!=='serie')return false; if(filtro==='favoritos'&&!fav.includes(f.id))return false; if(['acao','comedia','drama','terror'].includes(filtro)&&f.cat.toLowerCase()!==filtro)return false; if(busca&&!f.t.toLowerCase().includes(busca))return false; return true; }); document.getElementById('conteudo').innerHTML=`<div class="filtros"><button onclick="setFiltro('todos')" class="${filtro==='todos'?'active':''}">Todos</button><button onclick="setFiltro('filme')" class="${filtro==='filme'?'active':''}">🎬 Filmes</button><button onclick="setFiltro('serie')" class="${filtro==='serie'?'active':''}">📺 Séries</button><button onclick="setFiltro('favoritos')" class="${filtro==='favoritos'?'active':''}">❤️ Favoritos</button></div><h2>${filtro==='todos'?'🔥 Em Alta':filtro}</h2><div class="grid">${lista.map(f=>`<div class="card" onclick="abrir(${JSON.stringify(f.id)})">${isAdmin?`<button class="del" onclick="event.stopPropagation();apagar(${JSON.stringify(f.id)},${f.doSup||false})">✖</button>`:''}<img src="${f.img}"><div class="card-info"><h3>${f.t}</h3><p>${f.ano} • ⭐ ${f.nota} • ${f.cat} • ${f.tipo}</p><button onclick="event.stopPropagation();favoritar(${JSON.stringify(f.id)})">${fav.includes(f.id)?'❤️ Favoritado':'🤍 Favoritar'}</button></div></div>`).join('')||'<p style="padding:20px">Nenhum filme. Vai ao Admin e adiciona!</p>'}</div><p style="text-align:center;color:#666;padding:20px;font-size:12px">Total: ${FILMES.length} conteúdos • Only24</p>`; }
function setFiltro(f){filtro=f;mostrar();}
function favoritar(id){ if(fav.includes(id))fav=fav.filter(x=>x!==id); else fav.push(id); localStorage.setItem('fav',JSON.stringify(fav)); mostrar(); }
async function apagar(id,doSup){ if(!confirm('Apagar este filme?'))return; if(doSup){ await supabase.from('filmes').delete().eq('id',id); carregar(); } else { FILMES=FILMES.filter(x=>x.id!==id); mostrar(); } }
function abrir(id){ let f=FILMES.find(x=>x.id===id); let isYT=f.video&&f.video.includes('youtube'); let player=isYT?`<iframe src="${f.video}" allowfullscreen></iframe>`:f.video?`<video controls src="${f.video}"></video>`:'<p>Sem vídeo</p>'; let d=document.createElement('div'); d.id='modal'; d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:2000;padding:20px;overflow:auto'; d.innerHTML=`<button onclick="document.getElementById('modal').remove()" style="background:red;color:white;border:none;padding:10px 20px;border-radius:20px">✖ Fechar</button><h2 style="margin:15px 0 5px">${f.t}</h2><p>${f.ano} • ⭐ ${f.nota} • ${f.cat} • ${f.tipo}</p><p style="margin:10px 0">${f.desc}</p>${player}`; document.body.appendChild(d); }
function abrirAdmin(){ let senha=prompt('Senha do Admin (a senha é: 1234)'); if(senha!=='1234'){alert('Senha errada!');return;} isAdmin=true; fecharMenu(); let d=document.createElement('div'); d.id='modal'; d.style.cssText='position:fixed;inset:0;background:#111;z-index:2000;padding:20px;overflow:auto'; d.innerHTML=`<button onclick="document.getElementById('modal').remove();isAdmin=false;mostrar()" style="background:red;color:white;border:none;padding:10px 20px;border-radius:20px">✖ Sair do Admin</button><h2 style="margin:15px 0">🔐 Painel Admin - Postar Filme/Série</h2><input id="nTitulo" placeholder="Título do filme/série"><select id="nTipo"><option value="filme">🎬 Filme</option><option value="serie">📺 Série</option><option value="anime">🎌 Anime</option></select><select id="nCat"><option>Ação</option><option>Comédia</option><option>Drama</option><option>Terror</option><option>Romance</option><option>Fantasia</option><option>Aventura</option></select><input id="nAno" placeholder="Ano ex: 2024" type="number"><input id="nNota" placeholder="Nota ex: 8.5"><p style="font-size:13px;color:#aaa;margin-top:10px">Foto do poster (do telefone):</p><input type="file" id="nFoto" accept="image/*"><input id="nImg" placeholder="OU cola link da imagem (poster)"><p style="font-size:13px;color:#aaa;margin-top:10px">Vídeo (do telefone):</p><input type="file" id="nVideoFile" accept="video/*"><input id="nVideo" placeholder="OU link do vídeo YouTube embed"><textarea id="nDesc" placeholder="Descrição"></textarea><button class="btn" id="btnPub" onclick="salvarNovo()">✅ PUBLICAR AGORA</button><p id="statusPub" style="text-align:center;margin-top:10px;font-size:13px"></p><p style="color:#aaa;font-size:12px;margin-top:10px">Dica: No modo Admin aparece ✖ em cima dos filmes para apagar. O que publicares aparece para toda a gente!</p><h3 style="margin-top:20px">Filmes publicados: ${FILMES.length}</h3>`; document.body.appendChild(d); mostrar(); }
async function salvarNovo(){ let btn=document.getElementById('btnPub'); btn.innerText='A ENVIAR...'; document.getElementById('statusPub').innerText='A enviar, espera...'; try{ let t=document.getElementById('nTitulo').value; if(!t){alert('Escreve o título!');btn.innerText='✅ PUBLICAR AGORA';return;} let imgUrl=document.getElementById('nImg').value; let vidUrl=document.getElementById('nVideo').value; let foto=document.getElementById('nFoto').files[0]; let vidFile=document.getElementById('nVideoFile').files[0]; if(foto){ let nome=Date.now()+'_'+foto.name; let {error}=await supabase.storage.from('posters').upload(nome,foto); if(error)throw error; imgUrl=supabase.storage.from('posters').getPublicUrl(nome).data.publicUrl; } if(vidFile){ let nome=Date.now()+'_'+vidFile.name; let {error}=await supabase.storage.from('videos').upload(nome,vidFile); if(error)throw error; vidUrl=supabase.storage.from('videos').getPublicUrl(nome).data.publicUrl; } if(!imgUrl) imgUrl='https://via.placeholder.com/300x450/111/fff?text='+encodeURIComponent(t); let {error}=await supabase.from('filmes').insert([{titulo:t,tipo:document.getElementById('nTipo').value, categoria:document.getElementById('nCat').value, ano:document.getElementById('nAno').value||'2024', nota:document.getElementById('nNota').value||'7.0', imagem:imgUrl, descricao:document.getElementById('nDesc').value||'Novo lançamento Only24', video:vidUrl||''}]); if(error)throw error; alert('Publicado! ✅'); document.getElementById('modal').remove(); isAdmin=false; carregar(); }catch(e){ document.getElementById('statusPub').innerText='❌ Erro: '+e.message; btn.innerText='✅ PUBLICAR AGORA'; } }
carregar();
</script></body></html>
