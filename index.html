<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ONLY24 - Filmes, Séries e Animes</title>
<meta name="description" content="ONLY24 - Assiste filmes, séries e animes em HD.">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<!-- SPLASH -->
<div id="splash"><div id="splashLogo">ONLY<span>24</span></div><div class="splash-load"></div></div>

<!-- TOPBAR -->
<header id="topbar">
  <div class="topbar-inner">
    <button id="logo" class="logo">ONLY<span>24</span></button>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Pesquisar filmes, séries, animes..." autocomplete="off">
      <button id="searchBtn">🔍</button>
    </div>
    <div class="top-actions">
      <button id="bellBtn" class="icon-btn">🔔<span id="bellDot" class="dot hidden"></span></button>
      <button id="avatarBtn" class="avatar-btn"><img id="avatarImg" src="" alt=""><span id="avatarLetter">👤</span></button>
      <div id="userMenu" class="user-menu hidden">
        <button id="adminBtn" class="hidden">⚙️ Painel Admin</button>
        <button id="logoutBtn">Sair</button>
      </div>
      <button id="installBtn" class="install-btn hidden">Instalar App</button>
    </div>
  </div>
  <nav id="mainNav">
    <button class="nav-btn active" data-nav="home">Início</button>
    <button class="nav-btn" data-nav="filmes">Filmes</button>
    <button class="nav-btn" data-nav="series">Séries</button>
    <button class="nav-btn" data-nav="anime">Animes</button>
    <button class="nav-btn" data-nav="mylist">Minha Lista</button>
  </nav>
</header>

<!-- HERO -->
<section id="hero">
  <img id="heroBg" src="" alt="">
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1 id="heroTitle">Bem-vindo ao ONLY24</h1>
    <p id="heroMeta"></p>
    <p id="heroDesc"></p>
    <div class="hero-btns">
      <button id="heroPlay" class="btn-primary">▶ Assistir</button>
      <button id="heroInfo" class="btn-secondary">ℹ️ Detalhes</button>
    </div>
  </div>
</section>

<!-- MAIN -->
<main id="main">
  <section id="searchResults" class="hidden">
    <h2>Resultados da pesquisa</h2>
    <div id="gridHome" class="grid"></div>
  </section>

  <section id="homeSections">
    <h2>Continuar a assistir</h2>
    <div id="continueRow" class="row"></div>

    <h2>Em destaque</h2>
    <div id="catGrid" class="grid"></div>

    <h2>Séries</h2>
    <div id="seriesGrid" class="grid"></div>

    <h2>Animes</h2>
    <div id="animeGrid" class="grid"></div>

    <h2>Histórico</h2>
    <div id="historyRow" class="row"></div>

    <h2>Minha Lista</h2>
    <div id="myList" class="grid"></div>
  </section>
</main>

<!-- FAB ADMIN -->
<button id="fabAdmin" class="fab hidden">⚙️</button>
<button id="fabAdd" class="fab fab-add hidden">＋</button>

<!-- AUTH MODAL -->
<div id="authModal" class="modal hidden">
  <div class="modal-box">
    <button id="closeAuth" class="close">✕</button>
    <h2 id="authTitle">Entrar</h2>
    <input id="authName" type="text" placeholder="Nome (só para criar conta)" class="hidden">
    <input id="authEmail" type="email" placeholder="Email">
    <input id="authPass" type="password" placeholder="Senha">
    <button id="authSubmit" class="btn-primary full">Entrar</button>
    <p><button id="authSwitch" class="link">Criar conta nova</button></p>
  </div>
</div>

<!-- TITLE MODAL -->
<div id="titleModal" class="modal hidden">
  <div class="modal-box large">
    <button id="tmClose" class="close">✕</button>
    <img id="tmBackdrop" src="" alt="">
    <div class="tm-body">
      <img id="tmPoster" src="" alt="">
      <div>
        <h2 id="tmTitle"></h2>
        <p id="tmMeta"></p>
        <p id="tmDesc"></p>
        <p id="tmCast"></p>
        <div class="tm-btns">
          <button id="tmPlay" class="btn-primary">▶ Assistir</button>
          <button id="tmFav" class="btn-secondary">＋ Minha Lista</button>
          <button id="tmTrailer" class="btn-secondary">🎬 Trailer</button>
        </div>
        <div id="tmEpisodes"></div>
      </div>
    </div>
  </div>
</div>

<!-- PLAYER MODAL -->
<div id="playerModal" class="modal hidden">
  <div class="modal-box player-box">
    <button id="closePlayer" class="close">✕</button>
    <h3 id="playerTitle"></h3>
    <video id="player" controls playsinline controlsList="nodownload"></video>
    <div class="player-tools">
      <button id="downloadBtn" class="btn-secondary">⬇ Download</button>
      <select id="qualityList"></select>
      <select id="subtitlesList"></select>
    </div>
    <div id="dlList"></div>
  </div>
</div>

<!-- NOTIF MODAL -->
<div id="notifModal" class="modal hidden">
  <div class="modal-box">
    <button id="notifClose" class="close">✕</button>
    <h2>Notificações</h2>
    <div id="notifList"></div>
    <button id="notifClear" class="btn-secondary full">Limpar</button>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="modal hidden">
  <div class="modal-box large admin-box">
    <button id="adminClose" class="close">✕</button>
    <h2>Painel Admin</h2>
    <div class="admin-grid">
      <input id="fTitle" placeholder="Título *">
      <select id="fType"><option value="filme">Filme</option><option value="serie">Série</option><option value="anime">Anime</option></select>
      <select id="fCat"><option value="acao">Ação</option><option value="comedia">Comédia</option><option value="drama">Drama</option><option value="terror">Terror</option><option value="romance">Romance</option><option value="ficcao">Ficção</option><option value="animacao">Animação</option><option value="documentario">Documentário</option></select>
      <input id="fYear" type="number" placeholder="Ano">
      <input id="fRating" placeholder="Nota ex: 8.5">
      <textarea id="fSynopsis" placeholder="Sinopse"></textarea>
      <input id="fCast" placeholder="Elenco">
      <label><input id="fFeatured" type="checkbox"> Em destaque</label>
      <input id="fTrailer" placeholder="Link Trailer YouTube">
      <input id="fVideo" placeholder="Link Vídeo (filme)">
      <input id="fSubtitle" placeholder="Link Legenda .vtt (filme)">
      <input id="fDownload" placeholder="Link Download (filme)">
      <input id="fQualities" placeholder='Qualidades JSON ex: [{"label":"720p","url":"https://..."}]'>
      <input id="fPoster" placeholder="Link Poster">
      <input id="fBackdrop" placeholder="Link Backdrop">
      <label>Poster ficheiro <input id="fPosterFile" type="file" accept="image/*"></label>
      <label>Vídeo ficheiro <input id="fVideoFile" type="file" accept="video/*"></label>
      <label>Legenda ficheiro <input id="fSubtitleFile" type="file" accept=".vtt"></label>
    </div>
    <h3>Episódios (séries / animes)</h3>
    <div id="episodesWrap"></div>
    <button id="addEp" class="btn-secondary">＋ Adicionar Episódio</button>
    <button id="saveTitle" class="btn-primary full">Salvar Título</button>
    <p id="adminMsg"></p>
    <h3>Títulos existentes</h3>
    <div id="titlesAdminList"></div>
    <h3>Enviar Notificação</h3>
    <input id="notifTitle" placeholder="Título da notificação">
    <input id="notifBody" placeholder="Mensagem">
    <select id="notifTitleId"><option value="">Sem título ligado</option></select>
    <button id="sendNotif" class="btn-secondary full">Enviar Notificação</button>
  </div>
</div>

<!-- INSTALL BANNER -->
<div id="installBanner" class="install-banner hidden">
  <span>Instala o ONLY24 para melhor experiência</span>
  <button id="installNow" class="btn-primary">Instalar</button>
  <button id="installLater" class="btn-secondary">Depois</button>
</div>

<div id="toast" class="toast hidden"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
<script>
// FORÇAR SAÍDA DO SPLASH
setTimeout(function(){
  var s = document.getElementById('splash') || document.querySelector('.splash');
  if(s) s.style.display = 'none';
  var loader = document.querySelector('.loader');
  if(loader) loader.style.display = 'none';
  document.body.style.overflow = 'auto';
}, 3000);
</script>
</body>
</html>
