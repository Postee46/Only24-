function abrir(el,i){ let lista=el==='filmes'?filmes:el==='series'?series:animes; let f=lista[i]; let player=f.video&&f.video.includes('youtube')?`<iframe src="${f.video}" allowfullscreen></iframe>`:f.video?`<video controls src="${f.video}"></video>`:'<p>Sem vídeo</p>'; let epsHtml=''; if(f.tipo!=='filme'&&(f.eps&&f.eps.length)){ epsHtml=`<h3 style="margin:15px 0 5px">Episódios - Marca para baixar</h3>${f.eps.map((e,idx)=>`<div class="ep"><input type="checkbox" class="chkEp" data-url="${e.url}"><span style="flex:1">${e.nome}</span>${e.url?`<button onclick="window.open('${e.url}','_blank')">▶ Ver</button><button onclick="let a=document.createElement('a');a.href='${e.url}';a.download='${f.t}-${e.nome}.mp4';a.click()">⬇ Baixar</button>`:'<small>Sem ficheiro</small>'}</div>`).join('')}<button class="btn2" onclick="baixarSelecionados('${el}',${i},false)">⬇ BAIXAR SELECIONADOS DE UMA SÓ VEZ</button><button class="btn2" style="background:#333" onclick="baixarSelecionados('${el}',${i},true)">⬇ BAIXAR TODOS OS EPISÓDIOS</button>`; } let d=document.createElement('div'); d.id='modal'; d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:2000;padding:20px;overflow:auto'; d.innerHTML=`<button onclick="document.getElementById('modal').remove()" style="background:red;color:white;border:none;padding:10px 20px;border-radius:20px">✖ Fechar</button><h2 style="margin:15px 0 5px;padding:0">${f.t}</h2><p>⭐ ${f.n} • ${f.ano||''} • ${f.c} • ${f.tipo}</p><p style="margin:10px 0">${f.desc||''}</p>${player}${f.tipo==='filme'&&f.video?`<button class="btn2" onclick="baixarUm('${el}',${i})">⬇ BAIXAR FILME</button>`:''}${epsHtml}`; document.body.appendChild(d); }

r:#333"><h3>👥 Quem pode entrar no Admin? (Só tu decides)</h3><p style="font-size:13px;color:#aaa">Cria um código e manda para quem tu quiseres. Quem tiver o código entra como Admin. Podes apagar quando quiseres.</p><button class="btn2" onclick="criarCodigo()">+ Criar Novo Código de Convite</button><div id="listaCodigos" style="margin-top:10px">${codigos.map(c=>`<div style="background:#222;padding:10px;border-radius:8px;margin:5px 0;display:flex;justify-content:space-between"><b>${c}</b><button style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:8px;width:auto" onclick="removerCodigo('${c}')">Remover</button></div>`).join('')||'<p style="color:#888">Nenhum código ainda.</p>'}</div>`; document.body.appendChild(d); renderTudo(); }
