<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerar og-logo.jpg</title>
  <style>
    body{margin:0;min-height:100vh;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
    canvas{width:260px;height:260px;border-radius:14px;border:1px solid #333}
    button{background:#e50914;color:#fff;border:0;padding:14px 26px;border-radius:99px;font-size:16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <canvas id="c" width="800" height="800"></canvas>
  <button id="btn">⬇ Baixar og-logo.jpg</button>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#0a0a0f';
    ctx.fillRect(0, 0, 800, 800);

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = '900 130px Arial, Helvetica, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '12px';
    ctx.fillText('ONLY', 406, 335);
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

    ctx.font = '900 235px Arial, Helvetica, sans-serif';
    const w1 = ctx.measureText('24').width;
    ctx.font = '900 112px Arial, Helvetica, sans-serif';
    const w2 = ctx.measureText('24').width;
    const x = (800 - (w1 + 8 + w2)) / 2;

    ctx.fillStyle = '#e50914';
    ctx.textAlign = 'left';
    ctx.font = '900 235px Arial, Helvetica, sans-serif';
    ctx.fillText('24', x, 560);
    ctx.font = '900 112px Arial, Helvetica, sans-serif';
    ctx.fillText('24', x + w1 + 8, 465);

    document.getElementById('btn').onclick = () => {
      c.toBlob((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'og-logo.jpg';
        a.click();
      }, 'image/jpeg', 0.95);
    };
  </script>
</body>
</html>
